name: Evaluation Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run xUnit Unit Tests with Coverage
      run: |
        dotnet test backend/SampleApi.Tests/SampleApi.Tests.csproj \
          --logger "trx;LogFileName=xunit_results.trx" \
          --collect:"XPlat Code Coverage"

    - name: Install Node Dependencies
      working-directory: ./tests-e2e
      run: npm install

    # Fixed: Invoke Playwright CLI directly through Node to avoid permission denied (126)
    - name: Install Playwright Browsers
      working-directory: ./tests-e2e
      run: node node_modules/playwright/cli.js install

    - name: Start .NET API Background Process
      run: |
        dotnet run --project backend/SampleApi/SampleApi.csproj --urls "http://localhost:5000" &
        echo "API_PID=$!" >> $GITHUB_ENV
        sleep 5

    - name: Run Pactum API Tests
      working-directory: ./tests-e2e
      run: npm run test:api

    - name: Run CodeceptJS E2E Tests
      working-directory: ./tests-e2e
      run: npm run test:e2e

    - name: Stop .NET API
      if: always()
      run: |
        if [ -n "${{ env.API_PID }}" ]; then
          kill ${{ env.API_PID }} || true
        fi

    - name: Upload .NET Test Results & Coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dotnet-test-and-coverage-reports
        path: |
          backend/**/*.trx
          backend/**/TestResults/**/*.xml
          backend/**/TestResults/**/*.json

    - name: Upload CodeceptJS Test Artifacts (Screenshots & Logs)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeceptjs-failure-artifacts
        path: tests-e2e/output/