name: Evaluation Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run xUnit Unit Tests with Coverage
      run: |
        dotnet test backend/SampleApi.Tests/SampleApi.Tests.csproj \
          --logger "trx;LogFileName=xunit_results.trx" \
          --collect:"XPlat Code Coverage"

    - name: Install Node Dependencies
      working-directory: ./tests-e2e
      run: npm install

    # Use the official Playwright action to avoid command-not-found errors (127)
    - name: Install Playwright Browsers
      uses: microsoft/playwright-github-action@v1

    - name: Run API, Pactum, and CodeceptJS Tests
      run: |
        dotnet run --project backend/SampleApi/SampleApi.csproj --urls "http://localhost:5000" &
        API_PID=$!

        echo "Waiting for .NET API to start..."
        sleep 5

        echo "=== Running Pactum API Tests ==="
        npm --prefix tests-e2e run test:api

        echo "=== Running CodeceptJS E2E Tests ==="
        npm --prefix tests-e2e run test:e2e

        kill $API_PID

    - name: Upload .NET Test Results & Coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dotnet-test-and-coverage-reports
        path: |
          backend/**/*.trx
          backend/**/TestResults/**/*.xml
          backend/**/TestResults/**/*.json

    - name: Upload CodeceptJS Test Artifacts (Screenshots & Logs)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeceptjs-failure-artifacts
        path: tests-e2e/output/