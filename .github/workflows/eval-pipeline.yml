name: Evaluation Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Setup Environments
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 2. Run .NET Unit Tests with TRX Results and Code Coverage
    - name: Run xUnit Unit Tests with Coverage
      run: |
        dotnet test backend/SampleApi.Tests/SampleApi.Tests.csproj \
          --logger "trx;LogFileName=xunit_results.trx" \
          --collect:"XPlat Code Coverage"

    # 3. Install Node.js Test Dependencies & Playwright Binaries
    - name: Install Node Dependencies
      working-directory: ./tests-e2e
      run: npm ci

    - name: Install Playwright Browsers & System Dependencies
      working-directory: ./tests-e2e
      run: npx playwright install --with-deps

    # 4. Start .NET API, Run Pactum & CodeceptJS Sequentially, Then Stop API
    - name: Run API, Pactum, and CodeceptJS Tests
      run: |
        # Start the .NET API in the background on port 5000
        dotnet run --project backend/SampleApi/SampleApi.csproj --urls "http://localhost:5000" &
        API_PID=$!

        # Wait for the API to boot up
        echo "Waiting for .NET API to start..."
        sleep 5

        # Run Pactum API tests
        echo "=== Running Pactum API Tests ==="
        npm --prefix tests-e2e run test:api

        # Run CodeceptJS E2E tests (CodeceptJS automatically saves failure screenshots/logs to tests-e2e/output/)
        echo "=== Running CodeceptJS E2E Tests ==="
        npm --prefix tests-e2e run test:e2e

        # Clean up and terminate the background API process
        kill $API_PID

    # 5. Upload Test Results and Coverage Artifacts
    - name: Upload .NET Test Results & Code Coverage
      uses: actions/upload-artifact@v4
      if: always() # Uploads even if tests fail so you can inspect failures
      with:
        name: dotnet-test-and-coverage-reports
        path: |
          backend/**/*.trx
          backend/**/TestResults/**/*.xml
          backend/**/TestResults/**/*.json

    - name: Upload CodeceptJS Test Artifacts (Screenshots & Logs)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeceptjs-failure-artifacts
        path: tests-e2e/output/